name: YooGram Windows installer.

# Builds a Release x64 (Qt 6) YooGram and packs it into an Inno Setup
# installer plus a portable zip. Run it manually: Actions -> this workflow ->
# Run workflow. The result is in the run's Artifacts.
#
# Heads up: building both Debug and Release libraries is heavy (hours, lots of
# disk). If the runner runs out of space, build locally, see
# docs/yoogram-build.md.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   API_ID, API_HASH - your own Telegram API credentials. Without them the
#                      limited test credentials are used, which is only fine
#                      for a quick look: login breaks after a while.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt6-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt6-

      - name: Libraries.
        # No "skip-release": a Release build of the app needs Release libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6

      - name: Choose API credentials.
        shell: bash
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            echo "TDESKTOP_BUILD_API=-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH" >> $GITHUB_ENV
          else
            echo "::warning::API_ID/API_HASH secrets are not set, using the limited test credentials."
            echo "TDESKTOP_BUILD_API=-D TDESKTOP_API_TEST=ON" >> $GITHUB_ENV
          fi

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: YooGram build.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          qt6 ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_SPECIAL_TARGET=win64 ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config Release --parallel

      - name: Read version.
        shell: bash
        run: |
          VERSION=$(awk '$1 == "AppVersionStrSmall" { print $2 }' $TBUILD/$REPO_NAME/Telegram/build/version)
          echo "YOOGRAM_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Prepare installer inputs.
        shell: bash
        run: |
          cd $TBUILD/$REPO_NAME
          # Auto-update is disabled, so there is no Updater.exe, and the
          # signing tool of the official releases is not available here.
          sed -i '/Updater\.exe/d' Telegram/build/setup.iss
          sed -i '/^SignTool=/d' Telegram/build/setup.iss
          # The installer bundles d3dcompiler_47.dll, take the system one.
          mkdir -p out/Release/modules/x64/d3d
          cp "$SYSTEMROOT/System32/d3dcompiler_47.dll" out/Release/modules/x64/d3d/

      - name: Install Inno Setup.
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram\build
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ^
            /dMyAppVersion=%YOOGRAM_VERSION% ^
            /dMyAppVersionFull=%YOOGRAM_VERSION% ^
            "/dReleasePath=%TBUILD%\%REPO_NAME%\out\Release" ^
            /dMyBuildTarget=win64 ^
            /dMyOutputBaseFilename=YooGram-setup-x64-%YOOGRAM_VERSION% ^
            setup.iss

      - name: Make a portable zip.
        shell: bash
        run: |
          cd $TBUILD/$REPO_NAME/out/Release
          mkdir -p portable/YooGram/TelegramForcePortable
          touch portable/YooGram/TelegramForcePortable/.keep
          cp Telegram.exe portable/YooGram/
          (cd portable && 7z a -mx9 ../YooGram-portable-x64-$YOOGRAM_VERSION.zip YooGram/)

      - name: Move artifacts.
        shell: bash
        run: |
          mkdir -p artifact
          mv $TBUILD/$REPO_NAME/out/Release/YooGram-setup-x64-$YOOGRAM_VERSION.exe artifact/
          mv $TBUILD/$REPO_NAME/out/Release/YooGram-portable-x64-$YOOGRAM_VERSION.zip artifact/

      - uses: actions/upload-artifact@v7
        name: Upload artifacts.
        with:
          name: YooGram-windows-x64
          path: artifact\
          retention-days: 14
